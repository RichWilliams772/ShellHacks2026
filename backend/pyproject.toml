[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsync-backend"
version = "0.1.0"
description = "GridSync backend for cross-utility coordination opportunities"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.6.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# backend/app/main.py isn't one of Vercel's auto-scanned default entrypoint
# locations (app.py/main.py/etc. at the repo root or one level into src/ or
# app/) - the repo root has a backend/ prefix in front of it. This tells
# Vercel exactly where the FastAPI `app` instance lives instead. Module path
# matches this package's own name (see [tool.setuptools.packages.find]
# above) and its own internal imports (e.g. `from app.config import ...`).
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
